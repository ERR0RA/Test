<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON SAMURAI | Cyber-Slash</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #ui {
            position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-around;
            color: #00ffff; font-size: 1.5rem; pointer-events: none;
            text-shadow: 0 0 20px #00ffff; z-index: 10; font-weight: bold;
        }
        .stat-box { background: rgba(0, 255, 255, 0.1); padding: 5px 20px; border: 1px solid #00ffff; border-radius: 5px; }
        #score-val { color: #fff; font-size: 2.2rem; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, rgba(20,0,40,0.9) 0%, rgba(0,0,0,1) 100%);
            color: #00ffff; z-index: 20; text-align: center;
        }
        h1 { font-size: 4rem; letter-spacing: 10px; margin: 0; color: #00ffff; text-shadow: 0 0 30px #00ffff; }
        .high-score-msg { color: #ff00ff; margin-top: 10px; font-weight: bold; letter-spacing: 2px; }
        
        button {
            margin-top: 30px; padding: 15px 50px; background: none;
            border: 2px solid #ff00ff; color: #ff00ff; font-size: 1.5rem;
            cursor: pointer; transition: 0.3s; letter-spacing: 3px; border-radius: 5px;
        }
        button:hover { background: #ff00ff; color: #000; box-shadow: 0 0 50px #ff00ff; }
        #blade-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; background: #00ffff; opacity: 0; z-index: 5;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stat-box">COMBO: <span id="score-val">0</span></div>
        <div class="stat-box">BEST: <span id="best-val">0</span></div>
    </div>
    
    <div id="blade-flash"></div>

    <div id="overlay">
        <h1>NEON SAMURAI</h1>
        <p>SLASH THE RED NODES | DON'T LET THEM PASS</p>
        <div id="menu-best-container" class="high-score-msg">CRITICAL SYNC RECORD: <span id="menu-best">0</span></div>
        <button id="startBtn">SYNC NEURAL LINK</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, blade;
        let targets = [];
        let particles = [];
        let gameActive = false;
        let score = 0;
        let highScore = localStorage.getItem('neonSamuraiBest') || 0;
        let clock = new THREE.Clock();

        // Update UI with initial high score
        document.getElementById('best-val').innerText = highScore;
        document.getElementById('menu-best').innerText = highScore;

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.1);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            const pLight = new THREE.PointLight(0x00ffff, 20, 15);
            pLight.position.set(0, 2, 2);
            scene.add(pLight);
            scene.add(new THREE.AmbientLight(0x202020));

            const grid = new THREE.GridHelper(100, 40, 0xff00ff, 0x220022);
            grid.position.y = -1;
            scene.add(grid);

            const bladeGeo = new THREE.CapsuleGeometry(0.03, 1.8, 4, 8);
            const bladeMat = new THREE.MeshStandardMaterial({ 
                color: 0x00ffff, 
                emissive: 0x00ffff, 
                emissiveIntensity: 10 
            });
            blade = new THREE.Mesh(bladeGeo, bladeMat);
            scene.add(blade);

            window.addEventListener('mousemove', onMouseMove);
            document.getElementById('startBtn').onclick = startGame;

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function startGame() {
            document.getElementById('overlay').style.display = 'none';
            gameActive = true;
            score = 0;
            document.getElementById('score-val').innerText = "0";
            spawnTarget();
        }

        function saveScore() {
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neonSamuraiBest', highScore);
                return true;
            }
            return false;
        }

        function onMouseMove(e) {
            const x = (e.clientX / window.innerWidth) * 2 - 1;
            const y = -(e.clientY / window.innerHeight) * 2 + 1;
            blade.position.set(x * 5, y * 3 + 1.5, 1);
            blade.rotation.z = x * 0.8;
            blade.rotation.x = -0.5;
        }

        function spawnTarget() {
            if(!gameActive) return;
            const geo = new THREE.IcosahedronGeometry(0.5, 0);
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0xff0055, 
                emissive: 0xff0055,
                emissiveIntensity: 2
            });
            const target = new THREE.Mesh(geo, mat);
            
            target.position.set((Math.random()-0.5)*10, (Math.random()*4), -30);
            scene.add(target);
            targets.push(target);

            setTimeout(spawnTarget, Math.max(200, 1000 - score * 10));
        }

        function createExplosion(pos) {
            for(let i=0; i<15; i++) {
                const p = new THREE.Mesh(
                    new THREE.BoxGeometry(0.1, 0.1, 0.1),
                    new THREE.MeshBasicMaterial({ color: 0x00ffff })
                );
                p.position.copy(pos);
                p.userData.velocity = new THREE.Vector3(
                    (Math.random()-0.5)*0.5,
                    (Math.random()-0.5)*0.5,
                    (Math.random()-0.5)*0.5
                );
                scene.add(p);
                particles.push(p);
            }
            const flash = document.getElementById('blade-flash');
            flash.style.opacity = '0.3';
            setTimeout(() => flash.style.opacity = '0', 50);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if(gameActive) {
                for(let i = targets.length - 1; i >= 0; i--) {
                    targets[i].position.z += 0.25 + (score/200);
                    targets[i].rotation.y += 0.1;

                    const dist = targets[i].position.distanceTo(blade.position);
                    if(dist < 1.2) {
                        createExplosion(targets[i].position);
                        scene.remove(targets[i]);
                        targets.splice(i, 1);
                        score++;
                        document.getElementById('score-val').innerText = score;
                        continue;
                    }

                    if(targets[i].position.z > 6) {
                        gameActive = false;
                        const isNewBest = saveScore();
                        alert(isNewBest ? 
                            `NEW HIGH SYNC: ${score}!` : 
                            `NEURAL OVERLOAD\nCOMBO: ${score}\nRECORD: ${highScore}`);
                        location.reload();
                    }
                }

                for(let i = particles.length - 1; i >= 0; i--) {
                    particles[i].position.add(particles[i].userData.velocity);
                    particles[i].scale.multiplyScalar(0.95);
                    if(particles[i].scale.x < 0.01) {
                        scene.remove(particles[i]);
                        particles.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
