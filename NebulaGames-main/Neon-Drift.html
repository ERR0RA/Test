<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Drift Rivals</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;touch-action:manipulation}
body{
background:radial-gradient(circle at top,#111827,#020617 75%);
color:white;
overflow:hidden;
display:flex;
flex-direction:column;
align-items:center;
min-height:100vh;
}
h1{
margin-top:10px;
font-size:2.5rem;
color:#00f5ff;
text-shadow:0 0 15px #00f5ff,0 0 35px #8b5cf6;
}
#menu{
display:flex;
flex-wrap:wrap;
gap:10px;
margin:12px;
justify-content:center;
}
button,select{
padding:12px 18px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#00f5ff,#8b5cf6);
color:white;
font-size:1rem;
box-shadow:0 0 15px #00f5ff;
cursor:pointer;
transition:.2s;
}
button:hover{
transform:scale(1.08);
box-shadow:0 0 30px #00f5ff,0 0 45px #8b5cf6;
}
canvas{
width:min(96vw,1100px);
height:min(74vh,650px);
background:#0f172a;
border:3px solid #00f5ff;
border-radius:24px;
box-shadow:0 0 20px #00f5ff,0 0 50px #8b5cf6;
}
#info{margin-bottom:10px;color:#c4b5fd}
#mobile{
position:fixed;
bottom:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
padding:12px;
}
.side{display:flex;gap:10px}
.ctrl{
width:70px;
height:70px;
border-radius:50%;
border:none;
font-size:1.5rem;
background:rgba(0,245,255,.15);
color:white;
box-shadow:0 0 18px #00f5ff;
}
@media(min-width:900px){#mobile{display:none}}
</style>
</head>
<body>
<h1>🏎️ NEON DRIFT RIVALS 🏎️</h1>
<div id="menu">
<select id="mode">
<option value="1">Player vs Bot</option>
<option value="2">Player vs Player</option>
<option value="3">Bot vs Bot</option>
</select>
<button onclick="resetGame()">Start Race</button>
</div>
<div id="info">Dodge traffic • Collect boosts • First to 20 laps wins</div>
<canvas id="game" width="1100" height="650"></canvas>
<div id="mobile">
<div class="side">
<button class="ctrl" id="l1">◀</button>
<button class="ctrl" id="r1">▶</button>
<button class="ctrl" id="b1">⚡</button>
</div>
<div class="side">
<button class="ctrl" id="l2">◀</button>
<button class="ctrl" id="r2">▶</button>
<button class="ctrl" id="b2">⚡</button>
</div>
</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const keys={};
let mode=1;
let obstacles=[];
let boosts=[];
let particles=[];
let gameOver=false;

document.addEventListener('keydown',e=>keys[e.key]=true);
document.addEventListener('keyup',e=>keys[e.key]=false);

const p1={x:320,y:520,w:55,h:95,color:'#00f5ff',speed:8,boost:0,score:0};
const p2={x:720,y:520,w:55,h:95,color:'#ff00ff',speed:8,boost:0,score:0};

function resetGame(){
mode=parseInt(document.getElementById('mode').value);
p1.x=320;p2.x=720;
p1.score=0;p2.score=0;
obstacles=[];
boosts=[];
particles=[];
gameOver=false;
}

function spawnObstacle(){
if(Math.random()<0.05){
obstacles.push({
x:Math.random()*950+60,
y:-120,
w:60,
h:100,
speed:7+Math.random()*5
});
}
}

function spawnBoost(){
if(Math.random()<0.01){
boosts.push({
x:Math.random()*950+50,
y:-40,
r:14
});
}
}

function explode(x,y,color){
for(let i=0;i<25;i++){
particles.push({
x,y,
dx:(Math.random()-.5)*12,
dy:(Math.random()-.5)*12,
life:40,
color
});
}
}

function updatePlayers(){
if(mode!==3){
if(keys['ArrowLeft'])p1.x-=p1.speed+(p1.boost>0?6:0);
if(keys['ArrowRight'])p1.x+=p1.speed+(p1.boost>0?6:0);
if(keys['/'])p1.boost=40;
}

if(mode===2){
if(keys['a'])p2.x-=p2.speed+(p2.boost>0?6:0);
if(keys['d'])p2.x+=p2.speed+(p2.boost>0?6:0);
if(keys[' '])p2.boost=40;
}

if(mode===1||mode===3){
let target=boosts[0]?.x||Math.random()*900;
if(target<p2.x)p2.x-=5;
if(target>p2.x)p2.x+=5;
if(Math.random()<0.02)p2.boost=40;
}

if(mode===3){
let target=boosts[0]?.x||Math.random()*900;
if(target<p1.x)p1.x-=5;
if(target>p1.x)p1.x+=5;
if(Math.random()<0.02)p1.boost=40;
}

p1.x=Math.max(40,Math.min(canvas.width-95,p1.x));
p2.x=Math.max(40,Math.min(canvas.width-95,p2.x));

if(p1.boost>0)p1.boost--;
if(p2.boost>0)p2.boost--;
}

function updateObjects(){
spawnObstacle();
spawnBoost();

for(let i=obstacles.length-1;i>=0;i--){
let o=obstacles[i];
o.y+=o.speed;

[p1,p2].forEach(player=>{
if(player.x<o.x+o.w&&player.x+player.w>o.x&&player.y<o.y+o.h&&player.y+player.h>o.y){
explode(player.x+20,player.y+20,player.color);
player.score=Math.max(0,player.score-2);
player.x=Math.random()*900+50;
obstacles.splice(i,1);
}
});

if(o.y>canvas.height+100){
obstacles.splice(i,1);
p1.score++;
p2.score++;
}
}

for(let i=boosts.length-1;i>=0;i--){
let b=boosts[i];
b.y+=6;

[p1,p2].forEach(player=>{
const dx=(player.x+25)-b.x;
const dy=(player.y+25)-b.y;
if(Math.sqrt(dx*dx+dy*dy)<50){
player.boost=140;
explode(b.x,b.y,'#facc15');
boosts.splice(i,1);
}
});

if(b.y>canvas.height+50)boosts.splice(i,1);
}
}

function updateParticles(){
for(let i=particles.length-1;i>=0;i--){
let p=particles[i];
p.x+=p.dx;
p.y+=p.dy;
p.life--;
if(p.life<=0)particles.splice(i,1);
}
}

function drawRoad(){
ctx.fillStyle='#111827';
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.strokeStyle='rgba(255,255,255,.15)';
ctx.lineWidth=8;
for(let i=0;i<canvas.height;i+=50){
ctx.beginPath();
ctx.moveTo(canvas.width/2,i);
ctx.lineTo(canvas.width/2,i+30);
ctx.stroke();
}

for(let i=150;i<canvas.width;i+=200){
ctx.strokeStyle='rgba(0,245,255,.08)';
ctx.beginPath();
ctx.moveTo(i,0);
ctx.lineTo(i,canvas.height);
ctx.stroke();
}
}

function drawCar(player){
ctx.shadowColor=player.color;
ctx.shadowBlur=25;
ctx.fillStyle=player.color;
ctx.fillRect(player.x,player.y,player.w,player.h);
ctx.fillStyle='white';
ctx.fillRect(player.x+10,player.y+15,35,15);
ctx.shadowBlur=0;
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
drawRoad();

obstacles.forEach(o=>{
ctx.fillStyle='#ef4444';
ctx.shadowColor='#ef4444';
ctx.shadowBlur=20;
ctx.fillRect(o.x,o.y,o.w,o.h);
ctx.shadowBlur=0;
});

boosts.forEach(b=>{
ctx.beginPath();
ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
ctx.fillStyle='#facc15';
ctx.shadowColor='#facc15';
ctx.shadowBlur=25;
ctx.fill();
ctx.shadowBlur=0;
});

particles.forEach(p=>{
ctx.fillStyle=p.color;
ctx.fillRect(p.x,p.y,4,4);
});

if(p1.boost>0){
ctx.fillStyle='rgba(0,245,255,.3)';
ctx.fillRect(p1.x+15,p1.y+95,20,40);
}

if(p2.boost>0){
ctx.fillStyle='rgba(255,0,255,.3)';
ctx.fillRect(p2.x+15,p2.y+95,20,40);
}

drawCar(p1);
drawCar(p2);

ctx.font='34px Arial';
ctx.fillStyle='#00f5ff';
ctx.fillText(p1.score,460,50);
ctx.fillStyle='#ff00ff';
ctx.fillText(p2.score,600,50);

if(p1.score>=20||p2.score>=20){
gameOver=true;
ctx.font='70px Arial';
ctx.fillStyle='#fff';
ctx.shadowColor='#00f5ff';
ctx.shadowBlur=25;
ctx.fillText(p1.score>=20?'PLAYER 1 WINS':'PLAYER 2 WINS',240,320);
ctx.shadowBlur=0;
}

if(!gameOver){
updatePlayers();
updateObjects();
updateParticles();
}

requestAnimationFrame(draw);
}

function hold(btn,key){
btn.addEventListener('touchstart',e=>{e.preventDefault();keys[key]=true});
btn.addEventListener('touchend',e=>{e.preventDefault();keys[key]=false});
}

hold(document.getElementById('l1'),'ArrowLeft');
hold(document.getElementById('r1'),'ArrowRight');
hold(document.getElementById('b1'),'/');
hold(document.getElementById('l2'),'a');
hold(document.getElementById('r2'),'d');
hold(document.getElementById('b2'),' ');

draw();
</script>
</body>
</html>
