<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON OVERDRIVE | Nebula Arcade</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.85); color: #00ff88; z-index: 10;
            text-align: center;
        }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #00ff88;
            font-size: 24px; font-weight: bold; text-shadow: 0 0 10px #00ff88;
            pointer-events: none; z-index: 5;
        }
        h1 { font-size: 3rem; letter-spacing: 5px; margin-bottom: 10px; }
        button {
            padding: 15px 50px; font-size: 20px; background: transparent;
            border: 2px solid #00ff88; color: #00ff88; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
            margin-top: 20px;
        }
        button:hover { background: #00ff88; color: #000; box-shadow: 0 0 30px #00ff88; }
        .controls-hint { color: #888; font-size: 0.9rem; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="ui">SCORE: <span id="score">0</span></div>

    <div id="overlay">
        <h1>NEON OVERDRIVE</h1>
        <p>HIGH-SPEED NEURAL LINK ESTABLISHED</p>
        <button id="startBtn">INITIATE GAME</button>
        <div class="controls-hint">MOUSE / TOUCH TO STEER</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, tunnel, obstacles = [];
        let speed = 0.6;
        let score = 0;
        let gameActive = false;
        let targetX = 0;

        // --- 1. INITIALIZE ENGINE ---
        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000000, 5, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Dynamic Neon Lighting
            const pLight = new THREE.PointLight(0x00ff88, 20, 50);
            camera.add(pLight);
            scene.add(camera);

            // Hyper-Realistic Tunnel
            const tunnelGeo = new THREE.CylinderGeometry(6, 6, 400, 32, 1, true);
            const tunnelMat = new THREE.MeshStandardMaterial({
                color: 0x0a0a0a,
                side: THREE.BackSide,
                metalness: 0.9,
                roughness: 0.1
            });
            tunnel = new THREE.Mesh(tunnelGeo, tunnelMat);
            tunnel.rotation.x = Math.PI / 2;
            scene.add(tunnel);

            // Animated Grid Lines
            const grid = new THREE.GridHelper(400, 50, 0x00ff88, 0x002211);
            grid.rotation.x = Math.PI / 2;
            grid.position.z = -50;
            scene.add(grid);

            // Input Listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', (e) => {
                targetX = (e.clientX / window.innerWidth - 0.5) * 8;
            });
            document.addEventListener('touchmove', (e) => {
                targetX = (e.touches[0].clientX / window.innerWidth - 0.5) * 8;
            });

            document.getElementById('startBtn').addEventListener('click', () => {
                document.getElementById('overlay').style.display = 'none';
                gameActive = true;
                spawnObstacle();
            });

            animate();
        }

        // --- 2. GAME LOGIC ---
        function spawnObstacle() {
            if(!gameActive) return;
            
            const width = Math.random() * 3 + 1;
            const geo = new THREE.BoxGeometry(width, 0.4, 0.4);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const obs = new THREE.Mesh(geo, mat);
            
            // Random position inside the tunnel cylinder
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * 4;
            obs.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius, -120);
            
            scene.add(obs);
            obstacles.push(obs);
            
            // Speed up spawn rate over time
            setTimeout(spawnObstacle, Math.max(100, 450 - (score / 10)));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameActive) {
                speed += 0.0003;
                score += 1;
                document.getElementById('score').innerText = Math.floor(score/10);

                // Smooth Steering & Bank Tilt
                camera.position.x += (targetX - camera.position.x) * 0.1;
                camera.rotation.z = -camera.position.x * 0.05;

                // Move obstacles and check collisions
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].position.z += speed;

                    // Proximity Collision
                    if (obstacles[i].position.distanceTo(camera.position) < 1.4) {
                        endGame();
                    }

                    // Clean up distant objects
                    if (obstacles[i].position.z > 10) {
                        scene.remove(obstacles[i]);
                        obstacles.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function endGame() {
            gameActive = false;
            alert("NEURAL LINK SEVERED\nFINAL SCORE: " + Math.floor(score/10));
            location.reload();
        }

        init();
    </script>
</body>
</html>
