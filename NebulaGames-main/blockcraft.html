<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEBULA | Blockcraft Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --glass: rgba(15, 18, 24, 0.4);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
        }

        body { margin: 0; overflow: hidden; background: #020305; font-family: 'Plus Jakarta Sans', sans-serif; cursor: crosshair; }

        /* HUD Glass Styling */
        #hud {
            position: absolute; top: 30px; left: 30px;
            padding: 20px; background: var(--glass);
            backdrop-filter: blur(20px); border: 1px solid var(--border);
            border-radius: 20px; color: var(--text); z-index: 10;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px; border: 2px solid var(--primary);
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; mix-blend-mode: difference;
        }

        /* Apple-style Liquid Hotbar */
        #hotbar {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%); display: flex; gap: 12px;
            padding: 12px; background: var(--glass);
            backdrop-filter: blur(30px); border: 1px solid var(--border);
            border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .slot {
            width: 55px; height: 55px; border-radius: 16px;
            background: rgba(255,255,255,0.03); border: 1px solid transparent;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); color: var(--text); font-size: 9px;
        }

        .slot.active {
            background: rgba(var(--primary-rgb), 0.1);
            border-color: var(--primary); transform: scale(1.1) translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,255,136,0.2);
        }

        .block-preview { width: 20px; height: 20px; margin-bottom: 4px; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    
    <div id="hud">
        <h2 style="margin:0; font-size: 1rem; color: var(--primary);">NEBULA VOXEL CORE</h2>
        <p style="font-size: 0.7rem; opacity: 0.6; margin-bottom: 15px;">v5.0 Stable Release</p>
        <div style="font-size: 0.8rem; line-height: 1.6;">
            [L-CLICK] DE-ATOMIZE<br>
            [R-CLICK] CONSTRUCT<br>
            [SPACE] JUMP / ASCEND
        </div>
    </div>

    <div id="hotbar">
        <div id="slot1" class="slot active"><div class="block-preview" style="background:#55ab55"></div>GRASS</div>
        <div id="slot2" class="slot"><div class="block-preview" style="background:#8B4513"></div>DIRT</div>
        <div id="slot3" class="slot"><div class="block-preview" style="background:#777777"></div>STONE</div>
        <div id="slot4" class="slot"><div class="block-preview" style="background:#5D4037"></div>WOOD</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/PointerLockControls.js';

        let scene, camera, renderer, controls, raycaster;
        let moveFwd = false, moveBwd = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3();
        let prevTime = performance.now();
        let selectedSlot = 1;
        
        // Block Registry
        const BLOCKS = {
            1: { name: 'grass', color: 0x55ab55, roughness: 0.8 },
            2: { name: 'dirt', color: 0x8B4513, roughness: 0.9 },
            3: { name: 'stone', color: 0x777777, roughness: 0.4 },
            4: { name: 'wood', color: 0x5D4037, roughness: 0.7 }
        };

        const activeBlocks = [];
        const highlightBox = new THREE.Mesh(
            new THREE.BoxGeometry(1.01, 1.01, 1.01),
            new THREE.MeshBasicMaterial({ color: 0x00ff88, wireframe: true, transparent: true, opacity: 0.5 })
        );

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020305);
            scene.fog = new THREE.FogExp2(0x020305, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 10, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            controls = new PointerLockControls(camera, document.body);
            document.body.addEventListener('click', () => controls.lock());

            // --- Advanced Lighting ---
            const ambient = new THREE.AmbientLight(0x404040, 1.5);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffffff, 2.5);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            scene.add(sun);

            scene.add(highlightBox);
            raycaster = new THREE.Raycaster();
            raycaster.far = 10;

            // --- World Generation ---
            generateWorld();

            // --- Input Logic ---
            setupInputs();
            animate();
        }

        function generateWorld() {
            const size = 16;
            for(let x = -size; x < size; x++) {
                for(let z = -size; z < size; z++) {
                    const h = Math.floor(Math.sin(x/5) * Math.cos(z/5) * 3) + 5;
                    for(let y = 0; y <= h; y++) {
                        let type = (y === h) ? 'grass' : (y > h-2 ? 'dirt' : 'stone');
                        createBlock(x, y, z, type);
                    }
                }
            }
        }

        function createBlock(x, y, z, typeName) {
            const typeKey = Object.keys(BLOCKS).find(k => BLOCKS[k].name === typeName);
            const config = BLOCKS[typeKey];
            
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ 
                color: config.color, 
                roughness: config.roughness,
                metalness: 0.1
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            activeBlocks.push(mesh);
        }

        function setupInputs() {
            document.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW') moveFwd = true;
                if (e.code === 'KeyS') moveBwd = true;
                if (e.code === 'KeyA') moveL = true;
                if (e.code === 'KeyD') moveR = true;
                if (e.code === 'Space' && canJump) { velocity.y += 15; canJump = false; }
                
                if (['Digit1', 'Digit2', 'Digit3', 'Digit4'].includes(e.code)) {
                    document.getElementById(`slot${selectedSlot}`).classList.remove('active');
                    selectedSlot = parseInt(e.key);
                    document.getElementById(`slot${selectedSlot}`).classList.add('active');
                }
            });

            document.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') moveFwd = false;
                if (e.code === 'KeyS') moveBwd = false;
                if (e.code === 'KeyA') moveL = false;
                if (e.code === 'KeyD') moveR = false;
            });

            document.addEventListener('mousedown', (e) => {
                if (!controls.isLocked) return;
                
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(activeBlocks);

                if (intersects.length > 0) {
                    const intersect = intersects[0];
                    if (e.button === 0) { // Break
                        scene.remove(intersect.object);
                        activeBlocks.splice(activeBlocks.indexOf(intersect.object), 1);
                    } else if (e.button === 2) { // Place
                        const pos = intersect.object.position.clone().add(intersect.face.normal);
                        createBlock(pos.x, Math.round(pos.y), pos.z, BLOCKS[selectedSlot].name);
                    }
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked) {
                // Physics Simulation
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 40.0 * delta; // Gravity

                const direction = new THREE.Vector3();
                direction.z = Number(moveFwd) - Number(moveBwd);
                direction.x = Number(moveR) - Number(moveL);
                direction.normalize();

                if (moveFwd || moveBwd) velocity.z -= direction.z * 120.0 * delta;
                if (moveL || moveR) velocity.x -= direction.x * 120.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                camera.position.y += velocity.y * delta;

                // Simple Ground Level Collision
                if (camera.position.y < 3.5) {
                    velocity.y = 0;
                    camera.position.y = 3.5;
                    canJump = true;
                }

                // Hover Highlight Logic
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(activeBlocks);
                if (intersects.length > 0) {
                    highlightBox.position.copy(intersects[0].object.position);
                    highlightBox.visible = true;
                } else {
                    highlightBox.visible = false;
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
