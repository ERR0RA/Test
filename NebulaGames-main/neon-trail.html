<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=none">
    <title>NEON-GRID | OVERDRIVE</title>
    <style>
        body { 
            background: #050505; 
            color: #0f0; 
            font-family: 'Courier New', monospace; 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
            touch-action: none; 
            position: relative;
        }

        /* Fixed Side Customization Panel */
        #skin-panel {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: #111;
            border: 2px solid #0f0;
            padding: 15px;
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: inset 0 0 10px rgba(0,255,0,0.2);
            z-index: 10;
        }
        .skin-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .skin-group label {
            font-size: 0.8rem;
            font-weight: bold;
        }
        .skin-select-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .color-preview {
            width: 18px;
            height: 18px;
            border: 1px solid #fff;
            box-shadow: 0 0 5px currentColor;
            flex-shrink: 0;
        }
        select:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #555;
            color: #555;
        }

        #main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #wrapper { position: relative; display: flex; flex-direction: column; align-items: center; }
        canvas { border: 4px solid #0f0; background: #000; max-width: 75vw; max-height: 60vh; box-shadow: 0 0 30px rgba(0, 255, 0, 0.3); touch-action: none; }
        #ui { text-align: center; width: 800px; max-width: 75vw; margin-bottom: 10px; }
        .setup-panel { background: #111; padding: 15px; border: 2px solid #0f0; display: flex; gap: 15px; justify-content: center; align-items: center; flex-wrap: wrap; box-shadow: inset 0 0 10px rgba(0,255,0,0.2); }
        .meters { display: flex; justify-content: space-around; width: 100%; margin: 10px 0; gap: 10px; }
        .meter-container { width: 32%; background: #222; border: 2px solid #333; height: 16px; position: relative; border-radius: 3px; overflow: hidden; }
        .fill { height: 100%; width: 100%; transition: width 0.05s linear; }
        .label-overlay { position: absolute; width: 100%; text-align: center; font-size: 0.7rem; font-weight: bold; color: #fff; top: 1px; text-shadow: 1px 1px 2px #000; }
        #p1-fill { background: linear-gradient(90deg, #050, #0f0); } 
        #p2-fill { background: linear-gradient(90deg, #005, #00f); } 
        #p3-fill { background: linear-gradient(90deg, #500, #f00); }
        #msg { position: absolute; font-size: 3rem; font-weight: bold; top: 45%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; text-shadow: 0 0 15px #000; z-index: 100; text-align: center; width: 100%; letter-spacing: 4px; }
        button, select { background: #000; color: #0f0; border: 1px solid #0f0; padding: 8px 10px; cursor: pointer; font-weight: bold; font-family: 'Courier New', monospace; transition: all 0.2s; width: 100%; }
        .setup-panel select, .setup-panel button { width: auto; }
        button:hover { background: #0f0; color: #000; box-shadow: 0 0 15px #0f0; }
        .toggle-label { font-size: 0.8rem; display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
        #score { margin-bottom: 5px; font-size: 1.2rem; letter-spacing: 2px; font-weight: bold; text-shadow: 0 0 8px rgba(0,255,0,0.5); }

        #mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
            width: 100%;
            max-width: 400px;
            padding: 10px;
        }
        .ctrl-btn {
            width: 65px;
            height: 65px;
            background: rgba(0, 255, 0, 0.05);
            border: 2px solid #0f0;
            color: #0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            border-radius: 8px;
        }
        .ctrl-btn:active { background: #0f0; color: #000; box-shadow: 0 0 15px #0f0; }
        #btn-boost { grid-column: 3; background: rgba(255, 0, 0, 0.1); border-color: #f00; color: #f00; }
        
        @media (max-width: 1100px) {
            body { flex-direction: column; overflow-y: auto; height: auto; padding: 20px 0; }
            #skin-panel { position: static; transform: none; width: 80vw; margin-bottom: 15px; }
        }
        @media (pointer: coarse) {
            #mobile-controls { display: grid; }
            .setup-panel { padding: 8px; font-size: 0.8rem; }
            button, select { padding: 6px; }
        }
    </style>
</head>
<body>

<!-- Left Customization Panel -->
<div id="skin-panel">
    <div style="font-weight: bold; text-align: center; border-bottom: 1px solid #0f0; padding-bottom: 5px;">CUSTOMIZE SKINS</div>
    
    <div class="skin-group">
        <label for="p1Skin">P1 SKIN:</label>
        <div class="skin-select-wrapper">
            <select id="p1Skin">
                <option value="neon_green">Neon Green</option>
                <option value="hyper_blue">Hyper Blue</option>
                <option value="cyber_yellow">Cyber Yellow</option>
                <option value="plasma_pink">Plasma Pink</option>
                <option value="solar_orange">Solar Orange</option>
                <option value="acid_lime">Acid Lime</option>
                <option value="electric_cyan">Electric Cyan</option>
                <option value="violet_flare">Violet Flare</option>
                <option value="crimson_red">Crimson Red</option>
                <option value="pure_white">Pure White</option>
            </select>
            <div id="p1Preview" class="color-preview"></div>
        </div>
    </div>

    <div class="skin-group">
        <label for="p2Skin">P2 SKIN:</label>
        <div class="skin-select-wrapper">
            <select id="p2Skin">
                <option value="hyper_blue">Hyper Blue</option>
                <option value="neon_green">Neon Green</option>
                <option value="cyber_yellow">Cyber Yellow</option>
                <option value="plasma_pink">Plasma Pink</option>
                <option value="solar_orange">Solar Orange</option>
                <option value="acid_lime">Acid Lime</option>
                <option value="electric_cyan">Electric Cyan</option>
                <option value="violet_flare">Violet Flare</option>
                <option value="crimson_red">Crimson Red</option>
                <option value="pure_white">Pure White</option>
            </select>
            <div id="p2Preview" class="color-preview"></div>
        </div>
    </div>

    <div class="skin-group">
        <label for="botSkin">BOT SKIN:</label>
        <div class="skin-select-wrapper">
            <select id="botSkin">
                <option value="default">Default Profile Color</option>
                <option value="supernova">★ Supernova Gold</option>
                <option value="toxic_neon">★ Toxic Neon</option>
                <option value="void_purple">★ Void Purple</option>
                <option value="matrix_red">★ Matrix Red</option>
                <option value="neon_green">Neon Green</option>
                <option value="hyper_blue">Hyper Blue</option>
                <option value="cyber_yellow">Cyber Yellow</option>
                <option value="plasma_pink">Plasma Pink</option>
                <option value="solar_orange">Solar Orange</option>
                <option value="electric_cyan">Electric Cyan</option>
                <option value="pure_white">Pure White</option>
            </select>
            <div id="botPreview" class="color-preview"></div>
        </div>
    </div>
</div>

<!-- Centered Main Content -->
<div id="main-content">
    <div id="ui">
        <div id="score">P1: 0 | P2: 0 | BOT: 0</div>
        <div class="meters">
            <div class="meter-container" id="p1-ui"><div id="p1-fill" class="fill"></div><div class="label-overlay" id="lbl-p1">P1 ENERGY</div></div>
            <div class="meter-container" id="p2-ui"><div id="p2-fill" class="fill"></div><div class="label-overlay" id="lbl-p2">P2 ENERGY</div></div>
            <div class="meter-container" id="bot-ui"><div id="p3-fill" class="fill"></div><div class="label-overlay" id="lbl-b3">BOT ENERGY</div></div>
        </div>
        <div class="setup-panel">
            <select id="gameMode">
                <option value="pvpve">2 Humans vs Bot</option>
                <option value="pve">1 Human vs Bot</option>
                <option value="pvp">Human vs Human</option>
                <option value="bvb">Bot vs Bot (Spectate)</option>
            </select>
            
            <select id="botType2" style="display: none;">
                <option value="default">BOT 1: Default</option>
                <option value="failed">BOT 1: Failed</option>
                <option value="void">BOT 1: V0ID</option>
                <option value="ultimate">BOT 1: Ultimate</option>
                <option value="destroyer">BOT 1: Destroyer</option>
                <option value="error">BOT 1: ERR0R</option>
            </select>

            <select id="botType">
                <option value="default">BOT: Default</option>
                <option value="failed">BOT: Failed</option>
                <option value="void">BOT: V0ID</option>
                <option value="ultimate">BOT: Ultimate</option>
                <option value="destroyer">BOT: Destroyer</option>
                <option value="error">BOT: ERR0R</option>
            </select>
            
            <label class="toggle-label">
                <input type="checkbox" id="usePowerUps" checked> POWER-UPS
            </label>
            <button id="startBtn">ENGAGE</button>
        </div>
    </div>

    <div id="wrapper">
        <div id="msg"></div>
        <canvas id="game" width="800" height="600"></canvas>
    </div>

    <div id="mobile-controls">
        <div></div>
        <div class="ctrl-btn" id="btn-up">▲</div>
        <div class="ctrl-btn" id="btn-boost">B</div>
        <div class="ctrl-btn" id="btn-left">◀</div>
        <div class="ctrl-btn" id="btn-down">▼</div>
        <div class="ctrl-btn" id="btn-right">▶</div>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const UNIT = 5;

// Expanded Skins including Bot Exclusives
const SKINS = {
    neon_green: { name: 'Neon Green', color: '#00ff00', fillGradient: 'linear-gradient(90deg, #050, #0f0)' },
    hyper_blue: { name: 'Hyper Blue', color: '#0066ff', fillGradient: 'linear-gradient(90deg, #005, #00f)' },
    cyber_yellow: { name: 'Cyber Yellow', color: '#ffe600', fillGradient: 'linear-gradient(90deg, #550, #ff0)' },
    plasma_pink: { name: 'Plasma Pink', color: '#ff00ff', fillGradient: 'linear-gradient(90deg, #505, #f0f)' },
    solar_orange: { name: 'Solar Orange', color: '#ff6600', fillGradient: 'linear-gradient(90deg, #520, #f60)' },
    acid_lime: { name: 'Acid Lime', color: '#a6ff00', fillGradient: 'linear-gradient(90deg, #350, #a6ff00)' },
    electric_cyan: { name: 'Electric Cyan', color: '#00ffff', fillGradient: 'linear-gradient(90deg, #055, #00ffff)' },
    violet_flare: { name: 'Violet Flare', color: '#9933ff', fillGradient: 'linear-gradient(90deg, #305, #9933ff)' },
    crimson_red: { name: 'Crimson Red', color: '#ff0033', fillGradient: 'linear-gradient(90deg, #500, #ff0033)' },
    pure_white: { name: 'Pure White', color: '#ffffff', fillGradient: 'linear-gradient(90deg, #555, #ffffff)' },
    
    // Exclusive Bot Skins
    supernova: { name: 'Supernova Gold', color: '#ffd700', fillGradient: 'linear-gradient(90deg, #750, #ffd700)' },
    toxic_neon: { name: 'Toxic Neon', color: '#39ff14', fillGradient: 'linear-gradient(90deg, #140, #39ff14)' },
    void_purple: { name: 'Void Purple', color: '#8a2be2', fillGradient: 'linear-gradient(90deg, #305, #8a2be2)' },
    matrix_red: { name: 'Matrix Red', color: '#ff0055', fillGradient: 'linear-gradient(90deg, #501, #ff0055)' }
};

let grid, players, powerups = [], gameActive = false, score = {p1:0, p2:0, bot:0};
let powerupTimer = 0;
let glitchTick = 0;
let bot1Label = "BOT 1", bot2Label = "BOT 2";
let particles = [];
let screenShake = 0;

function updateSkinOptions() {
    const p1Select = document.getElementById('p1Skin');
    const p2Select = document.getElementById('p2Skin');
    const botSelect = document.getElementById('botSkin');
    
    const p1Val = p1Select.value;
    const p2Val = p2Select.value;
    const botVal = botSelect.value;

    Array.from(p1Select.options).forEach(opt => {
        opt.disabled = (opt.value === p2Val);
    });
    Array.from(p2Select.options).forEach(opt => {
        opt.disabled = (opt.value === p1Val);
    });

    document.getElementById('p1Preview').style.backgroundColor = SKINS[p1Val].color;
    document.getElementById('p1Preview').style.color = SKINS[p1Val].color;
    document.getElementById('p2Preview').style.backgroundColor = SKINS[p2Val].color;
    document.getElementById('p2Preview').style.color = SKINS[p2Val].color;
    
    if (botVal === 'default') {
        document.getElementById('botPreview').style.backgroundColor = '#555';
        document.getElementById('botPreview').style.color = '#555';
    } else {
        document.getElementById('botPreview').style.backgroundColor = SKINS[botVal].color;
        document.getElementById('botPreview').style.color = SKINS[botVal].color;
    }
}

document.getElementById('p1Skin').addEventListener('change', updateSkinOptions);
document.getElementById('p2Skin').addEventListener('change', updateSkinOptions);
document.getElementById('botSkin').addEventListener('change', updateSkinOptions);

document.getElementById('gameMode').addEventListener('change', function() {
    const b1Menu = document.getElementById('botType2');
    const mainBotMenu = document.getElementById('botType');
    if (this.value === 'bvb') {
        b1Menu.style.display = 'inline-block';
        mainBotMenu.options[0].text = "BOT 2: Default";
    } else {
        b1Menu.style.display = 'none';
        mainBotMenu.options[0].text = "BOT: Default";
    }
});

function getBotSettings(setting) {
    let color = '#f00';
    let profile = 'default';
    let speed = 2;
    
    if (setting === 'ultimate') { color = '#ff3333'; profile = 'ultimate'; speed = 2.1; }
    else if (setting === 'error') { color = '#00ffff'; profile = 'error'; speed = 1.9; }
    else if (setting === 'failed') { color = '#d97706'; profile = 'failed'; speed = 1.5; }
    else if (setting === 'destroyer') { color = '#ea580c'; profile = 'destroyer'; speed = 2.2; }
    else if (setting === 'void') { color = '#a855f7'; profile = 'void'; speed = 1.8; }
    return { color, profile, speed };
}

function createExplosion(x, y, color) {
    screenShake = 15;
    for (let i = 0; i < 40; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            radius: Math.random() * 3 + 1,
            color: color,
            alpha: 1,
            decay: Math.random() * 0.03 + 0.01
        });
    }
}

function reset() {
    const mode = document.getElementById('gameMode').value;
    const botSetting = document.getElementById('botType').value;
    const bot2Setting = document.getElementById('botType2').value;
    const botSkinKey = document.getElementById('botSkin').value;
    
    const p1SkinKey = document.getElementById('p1Skin').value;
    const p2SkinKey = document.getElementById('p2Skin').value;
    const p1Skin = SKINS[p1SkinKey];
    const p2Skin = SKINS[p2SkinKey];

    grid = Array(canvas.width).fill().map(() => Array(canvas.height).fill(null));
    powerups = [];
    particles = [];
    powerupTimer = 0;
    screenShake = 0;
    
    let b2 = getBotSettings(botSetting);
    let b1 = getBotSettings(bot2Setting);

    let b1ProfileName = bot2Setting.toUpperCase();
    let b2ProfileName = botSetting.toUpperCase();
    
    const isSameBot = (botSetting === bot2Setting);
    if (isSameBot) {
        bot1Label = b1ProfileName + " 1";
        bot2Label = b2ProfileName + " 2";
    } else {
        bot1Label = b1ProfileName;
        bot2Label = b2ProfileName;
    }

    // Apply custom skin if not set to default
    let finalBot2Color = (botSkinKey !== 'default') ? SKINS[botSkinKey].color : b2.color;
    let finalBot1Color = (botSkinKey !== 'default') ? SKINS[botSkinKey].color : b1.color;

    players = [
        { id: 0, x: 100, y: 200, dx: UNIT, dy: 0, color: p1Skin.color, trail: [], boost: 100, isBoosting: false, alive: true, active: (mode !== 'bvb'), team: 'human', ghost: 0, shield: false, baseSpeed: 2, speedBuffTimer: 0, isBot: false, profile: 'player' },
        { id: 1, x: 100, y: 400, dx: UNIT, dy: 0, color: p2Skin.color, trail: [], boost: 100, isBoosting: false, alive: true, active: (mode === 'pvpve' || mode === 'pvp'), team: 'human', ghost: 0, shield: false, baseSpeed: 2, speedBuffTimer: 0, isBot: false, profile: 'player' },
        { id: 2, x: 700, y: 300, dx: -UNIT, dy: 0, color: finalBot2Color, trail: [], boost: 100, isBoosting: false, alive: true, active: (mode !== 'pvp'), team: 'bot', ghost: 0, shield: false, baseSpeed: b2.speed, speedBuffTimer: 0, isBot: true, profile: b2.profile, isAltColor: false }
    ];

    document.getElementById('lbl-p1').innerText = (mode === 'bvb') ? bot1Label : "P1 ENERGY";
    document.getElementById('lbl-p2').innerText = "P2 ENERGY";
    document.getElementById('lbl-b3').innerText = (mode === 'bvb') ? bot2Label : (mode === 'pvp' ? "P2 ENERGY" : "BOT ENERGY");

    const fillBar = document.getElementById('p3-fill');
    if (botSkinKey !== 'default') {
        fillBar.style.background = SKINS[botSkinKey].fillGradient;
    } else {
        if (botSetting === 'ultimate') fillBar.style.background = '#444';
        else if (botSetting === 'error') fillBar.style.background = '#ff00ff';
        else if (botSetting === 'failed') fillBar.style.background = '#78350f';
        else if (botSetting === 'destroyer') fillBar.style.background = '#ff4500';
        else if (botSetting === 'void') fillBar.style.background = '#6b21a8';
        else fillBar.style.background = '#f00';
    }

    if (mode === 'bvb') {
        players[0].active = true; players[0].isBot = true; players[0].team = 'green_bot';
        players[0].color = finalBot1Color; players[0].profile = b1.profile; players[0].baseSpeed = b1.speed;
        players[1].active = false; players[2].active = true; players[2].team = 'red_bot';
        if (isSameBot && botSkinKey === 'default') players[2].isAltColor = true;

        const f1 = document.getElementById('p1-fill');
        if (botSkinKey !== 'default') {
            f1.style.background = SKINS[botSkinKey].fillGradient;
        } else {
            if (bot2Setting === 'ultimate') f1.style.background = '#444';
            else if (bot2Setting === 'error') f1.style.background = '#ff00ff';
            else if (bot2Setting === 'failed') f1.style.background = '#78350f';
            else if (bot2Setting === 'destroyer') f1.style.background = '#ff4500';
            else if (bot2Setting === 'void') f1.style.background = '#6b21a8';
            else f1.style.background = '#0f0';
        }
        
        document.getElementById('score').innerText = `${bot1Label}: ${score.p1} | ${bot2Label}: ${score.bot}`;
    } else {
        document.getElementById('p1-fill').style.background = p1Skin.fillGradient;
        document.getElementById('p2-fill').style.background = p2Skin.fillGradient;
        document.getElementById('score').innerText = `P1: ${score.p1} | P2: ${score.p2} | BOT: ${score.bot}`;
    }

    if (mode === 'pvp') players[1].team = 'red';
    
    document.getElementById('p1-ui').style.visibility = players[0].active ? "visible" : "hidden";
    document.getElementById('p2-ui').style.visibility = players[1].active ? "visible" : "hidden";
    document.getElementById('bot-ui').style.visibility = players[2].active ? "visible" : "hidden";
    
    document.getElementById('msg').innerHTML = mode === 'bvb' ? `<span style="color:#0ff">${bot1Label}</span> <span style="color:#fff">VS</span> <span style="color:#f00">${bot2Label}</span>` : "<span style='color:#0f0'>READY...</span>";
    gameActive = false;
    setTimeout(() => { document.getElementById('msg').innerText = ""; gameActive = true; }, 1500);
}

document.getElementById('startBtn').onclick = (e) => { e.target.blur(); reset(); };

const mobileInput = (dir) => {
    if (!players[0].active || players[0].isBot) return;
    if (dir === 'up' && players[0].dy === 0) { players[0].dx = 0; players[0].dy = -UNIT; }
    if (dir === 'down' && players[0].dy === 0) { players[0].dx = 0; players[0].dy = UNIT; }
    if (dir === 'left' && players[0].dx === 0) { players[0].dx = -UNIT; players[0].dy = 0; }
    if (dir === 'right' && players[0].dx === 0) { players[0].dx = UNIT; players[0].dy = 0; }
};

document.getElementById('btn-up').ontouchstart = (e) => { e.preventDefault(); mobileInput('up'); };
document.getElementById('btn-down').ontouchstart = (e) => { e.preventDefault(); mobileInput('down'); };
document.getElementById('btn-left').ontouchstart = (e) => { e.preventDefault(); mobileInput('left'); };
document.getElementById('btn-right').ontouchstart = (e) => { e.preventDefault(); mobileInput('right'); };
document.getElementById('btn-boost').ontouchstart = (e) => { e.preventDefault(); players[0].isBoosting = true; };
document.getElementById('btn-boost').ontouchend = (e) => { e.preventDefault(); players[0].isBoosting = false; };

window.onkeydown = e => {
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter", "ShiftRight", "ShiftLeft", "KeyF"].includes(e.code)) e.preventDefault();
    const mode = document.getElementById('gameMode').value;
    if (players[0].active && !players[0].isBot) {
        if ((e.key === 'w' || (mode === 'pve' && e.key === 'ArrowUp')) && players[0].dy === 0) { players[0].dx = 0; players[0].dy = -UNIT; }
        if ((e.key === 's' || (mode === 'pve' && e.key === 'ArrowDown')) && players[0].dy === 0) { players[0].dx = 0; players[0].dy = UNIT; }
        if ((e.key === 'a' || (mode === 'pve' && e.key === 'ArrowLeft')) && players[0].dx === 0) { players[0].dx = -UNIT; players[0].dy = 0; }
        if ((e.key === 'd' || (mode === 'pve' && e.key === 'ArrowRight')) && players[0].dx === 0) { players[0].dx = UNIT; players[0].dy = 0; }
        if (e.code === 'Space' || e.code === 'KeyF' || (mode === 'pve' && e.code === 'Enter')) players[0].isBoosting = true;
    }
    if (players[1].active) {
        if (e.key === 'ArrowUp' && players[1].dy === 0) { players[1].dx = 0; players[1].dy = -UNIT; }
        if (e.key === 'ArrowDown' && players[1].dy === 0) { players[1].dx = 0; players[1].dy = UNIT; }
        if (e.key === 'ArrowLeft' && players[1].dx === 0) { players[1].dx = -UNIT; players[1].dy = 0; }
        if (e.key === 'ArrowRight' && players[1].dx === 0) { players[1].dx = UNIT; players[1].dy = 0; }
        if (e.code === 'Enter' || e.code === 'ShiftRight') players[1].isBoosting = true;
    }
};

window.onkeyup = e => {
    const mode = document.getElementById('gameMode').value;
    if (e.code === 'Space' || e.code === 'KeyF' || (mode === 'pve' && e.code === 'Enter')) players[0].isBoosting = false;
    if (players[1].active && (e.code === 'Enter' || e.code === 'ShiftRight')) players[1].isBoosting = false;
};

function checkCollision(x, y, self) {
    if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) return true;
    
    for (let i = powerups.length - 1; i >= 0; i--) {
        const pu = powerups[i];
        if (Math.abs(x - pu.x) < 16 && Math.abs(y - pu.y) < 16) {
            applyPowerUp(self, pu.type);
            powerups.splice(i, 1);
            screenShake = 6;
        }
    }
    
    const hitId = grid[Math.floor(x)][Math.floor(y)];
    if (hitId === null) return false;
    if (self.ghost > 0) return false;
    
    const owner = players[hitId];
    if (self.id === owner.id) {
        if (self.shield) { self.shield = false; return false; }
        return true;
    }
    if (self.team === 'human' && owner.team === 'human') return false;
    
    if (self.shield) { self.shield = false; return false; }
    return true;
}

function applyPowerUp(player, type) {
    if (type === 'ghost') player.ghost = 200;
    if (type === 'shield') player.shield = true;
    if (type === 'battery') player.boost = Math.min(100, player.boost + 50);
    if (type === 'speed') player.speedBuffTimer = 240;
    if (type === 'clear') {
        grid = Array(canvas.width).fill().map(() => Array(canvas.height).fill(null));
        players.forEach(p => p.trail = []);
    }
}

function spawnPowerUp() {
    const types = ['ghost', 'speed', 'clear', 'shield', 'battery'];
    const type = types[Math.floor(Math.random() * types.length)];
    powerups.push({
        x: Math.random() * (canvas.width - 80) + 40,
        y: Math.random() * (canvas.height - 80) + 40,
        type: type,
        pulse: 0
    });
}

function update() {
    if (!gameActive) return;
    glitchTick++;

    if (document.getElementById('usePowerUps').checked) {
        powerupTimer++;
        if (powerupTimer > 180) { spawnPowerUp(); powerupTimer = 0; }
    }

    players.forEach(p => {
        if (p.active && p.alive && p.isBot) {
            let target = null;
            
            let minDist = 220;
            if (p.profile === 'ultimate') minDist = 260; 
            if (p.profile === 'void') minDist = 180;
            if (p.profile === 'destroyer') minDist = 400;

            powerups.forEach(pu => {
                let d = Math.hypot(p.x - pu.x, p.y - pu.y);
                if (d < minDist) { minDist = d; target = pu; }
            });

            if (!target && p.profile === 'destroyer') {
                let humanTarget = players.find(pl => pl.active && pl.alive && pl.team === 'human');
                if (humanTarget) target = humanTarget;
            }

            const checkAhead = (dx, dy, dist) => {
                for(let i=1; i<=dist; i++) {
                    if (checkCollision(p.x + dx*i, p.y + dy*i, p)) return true;
                }
                return false;
            };

            let turnChance = 0.15;
            if (p.profile === 'ultimate') turnChance = 0.16;
            if (p.profile === 'void') turnChance = 0.12;
            if (p.profile === 'destroyer') turnChance = 0.32; 
            if (p.profile === 'error') turnChance = 0.28;

            if (target && Math.random() < turnChance) {
                if (Math.abs(p.x - target.x) > 10 && p.dy !== 0) {
                    let newDx = p.x < target.x ? UNIT : -UNIT;
                    if (!checkAhead(newDx, 0, 15)) { p.dx = newDx; p.dy = 0; }
                } else if (Math.abs(p.y - target.y) > 10 && p.dx !== 0) {
                    let newDy = p.y < target.y ? UNIT : -UNIT;
                    if (!checkAhead(0, newDy, 15)) { p.dx = 0; p.dy = newDy; }
                }
            }

            let lookAheadDist = 14;
            if (p.profile === 'ultimate') lookAheadDist = 15;
            if (p.profile === 'void') lookAheadDist = 12;
            if (p.profile === 'destroyer') lookAheadDist = 18;

            if (checkAhead(p.dx, p.dy, lookAheadDist) || (Math.random() < (p.profile === 'error' ? 0.03 : 0.005))) {
                const dirs = [{dx:0,dy:-UNIT}, {dx:0,dy:UNIT}, {dx:-UNIT,dy:0}, {dx:UNIT,dy:0}]
                    .filter(d => !(d.dx === -p.dx && d.dy === -p.dy))
                    .sort(() => Math.random() - 0.5); 

                let bestDir = null, maxDist = -1;
                dirs.forEach(d => {
                    let dCount = 0;
                    let cap = (p.profile === 'ultimate') ? 45 : (p.profile === 'destroyer' ? 60 : 35);
                    while(dCount < cap && !checkCollision(p.x + d.dx*(dCount+1), p.y + d.dy*(dCount+1), p)) { dCount++; }
                    if (dCount > maxDist) { maxDist = dCount; bestDir = d; }
                });
                if (bestDir) { p.dx = bestDir.dx; p.dy = bestDir.dy; }
            }
            p.isBoosting = (p.boost > 0 && !checkAhead(p.dx, p.dy, 35) && p.profile !== 'failed');
        }
    });

    players.forEach(p => {
        if (!p.active || !p.alive) return;
        if (p.ghost > 0) p.ghost--;
        
        let boostMult = (p.isBoosting && p.boost > 0) ? 1.5 : 1.0;
        let speedVal = p.baseSpeed * boostMult;

        if (p.speedBuffTimer > 0) {
            p.speedBuffTimer--;
            speedVal *= 1.4;
        }

        if (p.profile === 'error') {
            speedVal *= (glitchTick % 20 < 5) ? 1.2 : (glitchTick % 30 === 0 ? 0.8 : 1);
        }

        if (p.isBoosting && p.boost > 0) {
            p.boost -= 2.0;
            if (p.boost < 0) p.boost = 0;
        } else if (p.boost < 100) {
            p.boost += 0.25;
        }
        
        let steps = Math.round(speedVal);
        for (let i = 0; i < steps; i++) {
            p.x += p.dx; p.y += p.dy;
            if (checkCollision(p.x, p.y, p)) { 
                p.alive = false; 
                createExplosion(p.x, p.y, p.color);
                checkWinner(); 
                return; 
            }
            grid[Math.floor(p.x)][Math.floor(p.y)] = p.id;
            p.trail.push({x: p.x, y: p.y, isGhost: p.ghost > 0, cycle: glitchTick});
        }
    });

    document.getElementById('p1-fill').style.width = players[0].boost + "%";
    document.getElementById('p2-fill').style.width = players[1].boost + "%";
    document.getElementById('p3-fill').style.width = players[2].boost + "%";
}

function checkWinner() {
    const mode = document.getElementById('gameMode').value;
    const p1 = players[0], p2 = players[1], bot = players[2];

    if (mode === 'pvp') {
        if (!p1.alive && !p2.alive) endGame("SIMULTANEOUS CRASH!");
        else if (!p1.alive) { score.p2++; endGame("PLAYER 2 VICTORIOUS"); }
        else if (!p2.alive) { score.p1++; endGame("PLAYER 1 VICTORIOUS"); }
    } 
    else if (mode === 'bvb') {
        if (!p1.alive && !bot.alive) endGame("GRID LOCKOUT!");
        else if (!p1.alive) { score.bot++; endGame(`${bot2Label} DOMINATES`); }
        else if (!bot.alive) { score.p1++; endGame(`${bot1Label} DOMINATES`); }
    } 
    else {
        const humansAlive = (p1.active && p1.alive) || (p2.active && p2.alive);
        if (!humansAlive) { score.bot++; endGame(`${bot2Label} WINS`); }
        else if (bot.active && !bot.alive) { score.p1++; endGame("HUMAN ALLIANCE WINS"); }
    }
}

function endGame(txt) {
    gameActive = false;
    document.getElementById('msg').innerHTML = `<span style="color:#fff; background:#000; padding:10px; border:2px solid #f00;">${txt}</span>`;
    setTimeout(reset, 2500);
}

function drawGridBackground() {
    ctx.strokeStyle = "rgba(0, 50, 0, 0.15)";
    ctx.lineWidth = 1;
    const size = 40;
    for (let x = 0; x < canvas.width; x += size) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += size) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }
}

function draw() {
    ctx.save();
    
    if (screenShake > 0) {
        let dx = (Math.random() - 0.5) * screenShake;
        let dy = (Math.random() - 0.5) * screenShake;
        ctx.translate(dx, dy);
        screenShake *= 0.9;
        if (screenShake < 0.5) screenShake = 0;
    }

    ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    drawGridBackground();
    
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) { particles.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 10; ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    powerups.forEach(pu => {
        pu.pulse += 0.1;
        let scale = 12 + Math.sin(pu.pulse) * 2;
        let col = '#fff';
        if (pu.type === 'speed') col = '#ff0';
        if (pu.type === 'clear') col = '#0ff';
        if (pu.type === 'shield') col = '#f0f';
        if (pu.type === 'battery') col = '#0f0';

        ctx.save();
        ctx.fillStyle = col;
        ctx.shadowBlur = 15; ctx.shadowColor = col;
        ctx.fillRect(pu.x - scale/2, pu.y - scale/2, scale, scale);
        
        ctx.fillStyle = '#000';
        ctx.fillRect(pu.x - 2, pu.y - 2, 4, 4);
        ctx.restore();
    });

    players.forEach(p => {
        if (!p.active) return;
        
        const botSkinKey = document.getElementById('botSkin').value;
        const isDefaultBotColor = (botSkinKey === 'default');

        p.trail.forEach(t => {
            if (t.isGhost) { ctx.fillStyle = '#222'; }
            else if (p.isAltColor) { ctx.fillStyle = (Math.floor(t.x/5 + t.cycle/2) % 5 === 0) ? '#22c55e' : '#14532d'; }
            else if (p.isBot && !isDefaultBotColor) { ctx.fillStyle = p.color; }
            else if (p.profile === 'ultimate') { ctx.fillStyle = (Math.floor(t.x + t.y) % 15 < 7) ? '#ff1a1a' : '#2b0000'; }
            else if (p.profile === 'destroyer') { ctx.fillStyle = (Math.floor(t.x/5 + t.cycle/2) % 4 === 0) ? '#eab308' : '#ea580c'; }
            else if (p.profile === 'void') { ctx.fillStyle = (Math.floor(t.y/6 + t.cycle/4) % 3 === 0) ? '#4c1d95' : '#7e22ce'; }
            else if (p.profile === 'failed') { ctx.fillStyle = (Math.floor(t.x + t.y) % 8 < 3) ? '#78350f' : ((t.cycle % 40 < 5) ? '#000' : '#b45309'); }
            else if (p.profile === 'error') {
                let colors = ['#00ffff', '#ff00ff', '#ffffff', '#222'];
                ctx.fillStyle = colors[(t.cycle + Math.floor(t.x/5)) % colors.length];
            } else { ctx.fillStyle = p.color; }
            
            ctx.fillRect(t.x, t.y, UNIT, UNIT);
        });

        if (p.alive) {
            ctx.save();
            let headX = p.x; let headY = p.y;
            
            if (p.profile === 'error' && glitchTick % 12 < 2) {
                headX += (Math.random() > 0.5 ? 4 : -4); headY += (Math.random() > 0.5 ? 4 : -4);
            }

            if (p.ghost > 0) { ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 15; }
            else if (p.isAltColor) { ctx.fillStyle = '#4ade80'; ctx.shadowColor = '#22c55e'; ctx.shadowBlur = 18; }
            else if (p.isBot && !isDefaultBotColor) { ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 15; }
            else if (p.profile === 'ultimate') { ctx.fillStyle = '#ff1a1a'; ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 18; }
            else if (p.profile === 'destroyer') { ctx.fillStyle = '#ff4500'; ctx.shadowColor = '#ff4500'; ctx.shadowBlur = 22; }
            else if (p.profile === 'void') { ctx.fillStyle = '#d946ef'; ctx.shadowColor = '#c084fc'; ctx.shadowBlur = 15; }
            else { ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 12; }
            
            ctx.fillRect(headX, headY, UNIT, UNIT);

            if (p.shield) {
                ctx.strokeStyle = '#f0f';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10; ctx.shadowColor = '#f0f';
                ctx.beginPath();
                ctx.arc(headX + UNIT/2, headY + UNIT/2, UNIT * 2.5, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();
        }
    });
    
    ctx.restore();
    update();
    requestAnimationFrame(draw);
}

updateSkinOptions();
reset();
draw();
</script>
